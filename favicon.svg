<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Software Lookup — favicon</title>
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#C24E10"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#favBg)"/>

  <!-- Simplified magnifier — readable at 16×16 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="27" cy="27" r="13"/>
    <line x1="37" y1="37" x2="48" y2="48"/>
  </g>
</svg>
